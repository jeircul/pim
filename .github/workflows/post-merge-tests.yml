name: Post Merge Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Run go test ./...
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Go cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify modules
        run: |
          go mod download
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Run tests
        id: run-tests
        continue-on-error: true
        run: go test ./...

      - name: Create issue on failure
        if: steps.run-tests.outcome == 'failure' && github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const shortSha = context.sha.substring(0, 7);
            const title = `Post-merge tests failed for ${shortSha}`;
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} "${title}" state:open type:issue`
            });
            if (search.data.total_count === 0) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: [
                  `Post-merge verification failed for commit ${context.sha}.`,
                  '',
                  `- Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                  `- Trigger: ${context.eventName}`,
                  '',
                  'Please inspect the workflow logs and address the failing tests.'
                ].join('\n')
              });
            }

      - name: Fail workflow when tests fail
        if: steps.run-tests.outcome == 'failure'
        run: exit 1
